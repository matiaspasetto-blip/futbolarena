<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Arena - Minijuegos</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">FUTBOL<span>ARENA</span></h1>
            <p class="subtitle">Elige tu desafío del día</p>
        </header>

        <main class="grid-juegos">
            <a href="index.html" class="card-juego">
                <div class="card-content">
                    <div class="icon">⚽</div>
                    <h3>Futbol Wordle</h3>
                    <p>Adivina al jugador en 6 intentos.</p>
                    <span class="btn-jugar">JUGAR</span>
                </div>
            </a>

            <a href="top10.html" class="card-juego">
                <div class="card-content">
                    <div class="icon">🔟</div>
                    <h3>Futbol Top 10</h3>
                    <p>Completa el top 10 según una pista.</p>
                    <span class="btn-jugar">JUGAR</span>
                </div>
            </a>

            <div class="card-juego locked">
                <div class="card-content">
                    <div class="badge">PRÓXIMAMENTE</div>
                    <div class="icon">🏆</div>
                    <h3>Modo Carrera</h3>
                    <p>Adivina el camino de un jugador.</p>
                </div>
            </div>

            <div class="card-juego locked">
                <div class="card-content">
                    <div class="badge">PRÓXIMAMENTE</div>
                    <div class="icon">🧬</div>
                    <h3>Connections</h3>
                    <p>Agrupa jugadores por categorías.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
